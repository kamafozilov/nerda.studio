[package]
name = "studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["bmp", "png", "tiff"] }
# Each session's journal: one event a line.
serde_json.workspace = true
theme.workspace = true
unicode-segmentation = "1.13"
workspace.workspace = true

# The same versions GPUI already builds on each platform.
[target.'cfg(target_os = "macos")'.dependencies]
app_bundle.workspace = true
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSResponder", "NSGraphics", "NSView", "NSWindow", "NSWorkspace"] }
objc2 = "0.6.5"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
