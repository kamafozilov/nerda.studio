[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Events reach the UI's async task from the reader threads; GPUI already uses it.
async-channel = "2.5"
# Encodes image attachments; already built for the app under usvg.
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
# Message and session ids; GPUI already depends on it.
uuid = { version = "1.28", features = ["v4"] }
workspace.workspace = true

# Stands in for the agent in the tests: plays a recorded fixture.
[[bin]]
name = "fake-agent"
path = "tests/support/fake_agent.rs"
test = false
doc = false
